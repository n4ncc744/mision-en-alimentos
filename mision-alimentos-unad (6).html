<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Misión: Ingeniero(a) de Alimentos UNAD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #071A33;
    --bg-alt: #0C2647;
    --surface: #123465;
    --surface-2: #1A4680;
    --surface-3: #235A9E;
    --primary: #F15A22;
    --lime: #F5B942;
    --lime-dim: #D99A2E;
    --mango: #F15A22;
    --sky: #6FCBEA;
    --berry: #F0728A;
    --text: #F3F6FB;
    --text-dim: #A9C0DE;
    --border: rgba(243,246,251,0.14);
    --radius: 18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top left, rgba(111,203,234,0.12), transparent 45%),
      radial-gradient(ellipse at bottom right, rgba(62,142,255,0.14), transparent 50%),
      var(--bg);
    color:var(--text);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:24px 14px 60px;
  }
  h1,h2,h3,.display{
    font-family:'Space Grotesk', sans-serif;
    letter-spacing:-0.01em;
  }
  .app{width:100%;max-width:760px;}

  /* ---------- TRAIL / PROGRESS ---------- */
  .trail{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:28px;
    padding:14px 10px;
    background:var(--bg-alt);
    border:1px solid var(--border);
    border-radius:999px;
    position:relative;
  }
  .trail-line{
    position:absolute;
    left:34px; right:34px; top:50%;
    height:3px;
    background:var(--border);
    transform:translateY(-50%);
    z-index:0;
    border-radius:3px;
    overflow:hidden;
  }
  .trail-line-fill{
    height:100%;
    background:linear-gradient(90deg, var(--lime-dim), var(--lime));
    width:0%;
    transition:width .5s ease;
  }
  .trail-step{
    position:relative;
    z-index:1;
    width:34px;height:34px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--surface);
    border:2px solid var(--border);
    font-size:15px;
    flex-shrink:0;
    transition:all .3s ease;
  }
  .trail-step.done{background:var(--lime);border-color:var(--lime);color:#071A33;}
  .trail-step.active{border-color:var(--mango);box-shadow:0 0 0 4px rgba(241,90,34,0.22);}

  /* ---------- CARD / SCREEN ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:32px 28px;
    animation:fadein .4s ease;
  }
  @keyframes fadein{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  .eyebrow{
    display:inline-block;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--mango);
    background:rgba(241,90,34,0.12);
    border:1px solid rgba(241,90,34,0.3);
    padding:4px 12px;
    border-radius:999px;
    margin-bottom:14px;
  }
  h1.title{font-size:28px;line-height:1.15;margin:0 0 10px;}
  p.lead{color:var(--text-dim);font-size:15.5px;line-height:1.6;margin:0 0 20px;}
  .scenario{
    background:var(--surface-2);
    border-left:3px solid var(--sky);
    border-radius:10px;
    padding:14px 16px;
    font-size:14.5px;
    line-height:1.55;
    margin-bottom:22px;
    color:var(--text);
  }

  /* ---------- OPTIONS ---------- */
  .options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:20px;
  }
  @media (max-width:520px){ .options{grid-template-columns:1fr;} }
  .opt{
    background:var(--surface-2);
    border:1.5px solid var(--border);
    border-radius:12px;
    padding:13px 14px;
    font-size:14.5px;
    font-weight:500;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:10px;
    transition:all .15s ease;
    user-select:none;
  }
  .opt:hover{border-color:var(--sky);background:var(--surface-3);}
  .opt.selected{border-color:var(--mango);background:rgba(241,90,34,0.14);}
  .opt.correct{border-color:var(--lime);background:rgba(245,185,66,0.16);}
  .opt.incorrect{border-color:var(--berry);background:rgba(232,105,122,0.14);}
  .opt.locked{cursor:default;}
  .check{
    width:18px;height:18px;flex-shrink:0;
    border-radius:5px;border:1.5px solid var(--text-dim);
    display:flex;align-items:center;justify-content:center;
    font-size:12px;
  }
  .opt.selected .check{border-color:var(--mango);background:var(--mango);color:#071A33;}
  .opt.correct .check{border-color:var(--lime);background:var(--lime);color:#071A33;}
  .opt.incorrect .check{border-color:var(--berry);background:var(--berry);color:#fff;}

  /* ---------- BUTTONS ---------- */
  .btn{
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size:15px;
    border:none;
    border-radius:999px;
    padding:13px 26px;
    cursor:pointer;
    transition:transform .12s ease, opacity .15s ease;
    display:inline-flex;align-items:center;gap:8px;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--primary);color:#FFFFFF;}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;}
  .btn-primary:not(:disabled):hover{background:#FF7847;}
  .btn-ghost{background:transparent;color:var(--text-dim);border:1px solid var(--border);}
  .btn-ghost:hover{color:var(--text);border-color:var(--text-dim);}
  .btn-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}

  /* ---------- FEEDBACK ---------- */
  .feedback{
    margin-top:18px;
    padding:16px 18px;
    border-radius:12px;
    font-size:14.5px;
    line-height:1.5;
    display:none;
  }
  .feedback.show{display:block;animation:fadein .3s ease;}
  .feedback.good{background:rgba(245,185,66,0.12);border:1px solid rgba(245,185,66,0.35);}
  .feedback.meh{background:rgba(241,90,34,0.12);border:1px solid rgba(241,90,34,0.35);}
  .feedback-title{font-family:'Space Grotesk';font-weight:700;font-size:15.5px;margin-bottom:5px;}
  .points-pill{
    display:inline-block;margin-top:10px;
    background:var(--surface-3);border:1px solid var(--border);
    border-radius:999px;padding:5px 13px;font-size:13px;font-weight:600;color:var(--lime);
  }

  /* ---------- INTRO / STATIONS ---------- */
  .stations{display:flex;flex-direction:column;gap:8px;margin:22px 0 4px;}
  .station{
    display:flex;align-items:center;gap:12px;
    background:var(--surface-2);border:1px solid var(--border);
    border-radius:12px;padding:11px 14px;font-size:14px;color:var(--text-dim);
  }
  .station b{color:var(--text);font-weight:600;}
  .station .num{
    width:24px;height:24px;border-radius:50%;background:var(--surface-3);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
    color:var(--sky);flex-shrink:0;
  }

  /* ---------- SCORE HUD ---------- */
  .hud{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:14px;font-size:13.5px;color:var(--text-dim);
  }
  .hud b{color:var(--lime);font-family:'Space Grotesk';}

  /* ---------- CODE FRAGMENTS ---------- */
  .fragments{display:flex;gap:10px;justify-content:center;margin:20px 0;flex-wrap:wrap;}
  .frag{
    font-family:'Space Grotesk';font-weight:700;font-size:22px;
    background:var(--surface-3);border:1.5px solid var(--lime);color:var(--lime);
    padding:10px 16px;border-radius:10px;letter-spacing:.05em;
    animation:fadein .4s ease;
  }
  .frag.empty{border-style:dashed;border-color:var(--border);color:var(--text-dim);opacity:.5;}

  .code-reveal{
    text-align:center;font-family:'Space Grotesk';font-weight:700;
    font-size:38px;letter-spacing:.08em;color:var(--lime);
    margin:22px 0;text-shadow:0 0 30px rgba(245,185,66,0.35);
  }

  /* ---------- DIPLOMA ---------- */
  .diploma{
    border:2px solid var(--lime);
    border-radius:16px;
    padding:30px 24px;
    text-align:center;
    background:
      radial-gradient(circle at top, rgba(245,185,66,0.10), transparent 60%),
      var(--surface-2);
    margin:20px 0;
  }
  .diploma .rank{font-family:'Space Grotesk';font-weight:700;font-size:24px;color:var(--mango);margin:6px 0 2px;}
  .diploma input{
    background:var(--bg-alt);border:1.5px solid var(--border);border-radius:10px;
    color:var(--text);font-family:'Space Grotesk';font-size:18px;text-align:center;
    padding:10px 14px;margin-top:14px;width:80%;max-width:320px;
  }
  .diploma input:focus{outline:none;border-color:var(--lime);}
  .score-final{font-size:14px;color:var(--text-dim);margin-top:14px;}

  .footer-note{text-align:center;color:var(--text-dim);font-size:12.5px;margin-top:18px;}

  /* ---------- TOPBAR / RECORDS ---------- */
  .topbar{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:14px;font-size:13px;color:var(--text-dim);
  }
  .topbar b{color:var(--text);font-family:'Space Grotesk';font-weight:600;}
  .link-btn{
    background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);
    border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600;cursor:pointer;
  }
  .link-btn:hover{color:var(--text);border-color:var(--sky);}
  table.records{width:100%;border-collapse:collapse;margin:18px 0;font-size:13.5px;}
  table.records th, table.records td{
    text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);
  }
  table.records th{color:var(--text-dim);font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;}
  .empty-state{color:var(--text-dim);font-size:14px;text-align:center;padding:30px 10px;}

  /* ---------- LOGO ---------- */
  .logo-slot{height:30px;width:auto;object-fit:contain;display:block;}
  .logo-slot.hidden{display:none;}
  .brand{display:flex;align-items:center;gap:9px;}
  .diploma-logo{height:38px;width:auto;object-fit:contain;margin-bottom:10px;display:block;margin-left:auto;margin-right:auto;}
  .diploma-logo.hidden{display:none;}
</style>
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar"></div>
  <div class="trail" id="trail"></div>
  <div id="screen"></div>
  <div class="footer-note">Programa de Ingeniería de Alimentos · UNAD</div>
</div>

    fragment: "★",
  },
];

const RANKS = [
  { min: 260, label: "🥇 Ingeniero(a) de Alimentos Élite" },
  { min: 180, label: "🥈 Ingeniero(a) de Alimentos en formación" },
  { min: 100, label: "🥉 Aprendiz de la industria alimentaria" },
  { min: 0,   label: "🔄 ¡Necesitas repetir la misión!" },
];

/* ===================== STATE ===================== */
let state = {
  screen: "intro",       // intro | challenge | final | diploma
  current: 0,             // index into CHALLENGES
  score: 0,
  fragments: [],
  selections: [],         // per challenge, array of selected indices
  locked: false,
  bonusAnswered: false,
  bonusSelected: null,
};

let records = []; // se acumulan mientras la página siga abierta (no hay servidor)

/* ===================== GOOGLE FORM (registro centralizado) ===================== */
const GOOGLE_FORM_RESPONSE_URL = "https://docs.google.com/forms/d/e/1FAIpQLSd1-AshmfX18vguHe00OAqnBLoy7AqB2khDjrh7YMYnwbs3sw/formResponse";
const GOOGLE_FORM_FIELDS = {
  nombre: "entry.1454484834",
  puntaje: "entry.928272524",
  nivel: "entry.2075819927",
  fecha: "entry.873747836",
};
function submitToGoogleForm(record){
  const body = new URLSearchParams();
  body.append(GOOGLE_FORM_FIELDS.nombre, record.name);
  body.append(GOOGLE_FORM_FIELDS.puntaje, String(record.score));
  body.append(GOOGLE_FORM_FIELDS.nivel, record.rank);
  body.append(GOOGLE_FORM_FIELDS.fecha, record.fecha);
  fetch(GOOGLE_FORM_RESPONSE_URL, {
    method: "POST",
    mode: "no-cors", // Google Forms no permite leer la respuesta, pero sí recibe el envío
    body,
  }).catch(() => {}); // si no hay internet, no rompe el juego
}

const screenEl = document.getElementById("screen");
const trailEl = document.getElementById("trail");
const topbarEl = document.getElementById("topbar");

/* ===================== TOPBAR ===================== */
function renderTopbar(){
  topbarEl.innerHTML = `
    <span class="brand">
      <img class="logo-slot" src="${LOGO_DATA_URI}" alt="UNAD">
      <b>🧪 Misión Ingeniería de Alimentos</b>
    </span>
    <span class="link-btn" onclick="openRecords()">📋 Registros (${records.length})</span>
  `;
}

/* ===================== TRAIL ===================== */
function renderTrail(){
  const icons = ["🏫","📞","🎓","🧪","💼","🧑‍🔬","🤝","🔬","🔐"];
  const total = icons.length;
  if (state.screen === "records"){ trailEl.style.display = "none"; return; }
  trailEl.style.display = "flex";
  const activeIndex = state.screen === "intro" ? -1
    : state.screen === "challenge" ? state.current
    : total - 1; // final/diploma
  const doneCount = state.screen === "intro" ? 0
    : state.screen === "challenge" ? state.current
    : total;

  let html = `<div class="trail-line"><div class="trail-line-fill" style="width:${(doneCount/(total-1))*100}%"></div></div>`;
  icons.forEach((ic, i) => {
    let cls = "trail-step";
    if (i < doneCount) cls += " done";
    else if (i === activeIndex) cls += " active";
    html += `<div class="${cls}">${i < doneCount ? "✓" : ic}</div>`;
  });
  trailEl.innerHTML = html;
}

/* ===================== HUD ===================== */
function hud(){
  return `<div class="hud"><span>Progreso de la misión</span><span>Puntos: <b>${state.score}</b></span></div>`;
}

/* ===================== INTRO ===================== */
function renderIntro(){
  screenEl.innerHTML = `
    <div class="card">
      <span class="eyebrow">Cierre de inducción</span>
      <h1 class="title">🧪 Misión: Ingeniero(a) de Alimentos UNAD</h1>
      <p class="lead">Has iniciado tu camino como estudiante de Ingeniería de Alimentos. Para completar tu misión deberás demostrar que conoces tu universidad, tu programa, tu perfil profesional y las oportunidades que tienes como estudiante.</p>
      <div class="scenario">🔐 Supera los 8 retos y descubre el código final que certifica tu misión.</div>
      <div class="stations">
        <div class="station"><span class="num">1</span> <b>Cómo estudias en la UNAD</b></div>
        <div class="station"><span class="num">2</span> <b>Conducto regular</b></div>
        <div class="station"><span class="num">3</span> <b>Conoce tu programa</b> — créditos</div>
        <div class="station"><span class="num">4</span> <b>Áreas de tu programa</b></div>
        <div class="station"><span class="num">5</span> <b>Práctica profesional</b></div>
        <div class="station"><span class="num">6</span> <b>Tu perfil</b> como estudiante</div>
        <div class="station"><span class="num">7</span> <b>CIPAS</b> de Primera Matrícula</div>
        <div class="station"><span class="num">8</span> <b>Semilleros</b> de investigación</div>
      </div>
      <div class="btn-row" style="margin-top:24px;">
        <span style="font-size:13px;color:var(--text-dim);">⏱ Dura entre 10–15 minutos</span>
        <button class="btn btn-primary" onclick="startMission()">🚀 Iniciar misión</button>
      </div>
    </div>
  `;
}
function startMission(){
  state.screen = "challenge";
  state.current = 0;
  render();
}

/* ===================== CHALLENGE (selección única) ===================== */
function renderChallenge(){
  const c = CHALLENGES[state.current];
  if (state.selections[state.current] === undefined) state.selections[state.current] = null;
  const sel = state.selections[state.current]; // número o null

  const optsHtml = c.options.map((o, i) => {
    let cls = "opt";
    if (state.locked){
      cls += " locked";
      if (o.correct) cls += " correct";
      else if (sel === i) cls += " incorrect";
    } else if (sel === i) {
      cls += " selected";
    }
    const mark = state.locked ? (o.correct ? "✓" : (sel === i ? "✕" : "")) : (sel === i ? "●" : "");
    return `<div class="${cls}" onclick="selectOption(${i})">
      <span class="check">${mark}</span><span>${o.text}</span>
    </div>`;
  }).join("");

  const isCorrect = state.locked && sel !== null && c.options[sel] && c.options[sel].correct;
  const feedbackHtml = state.locked ? `
    <div class="feedback ${isCorrect ? "good" : "meh"} show">
      <div class="feedback-title">${isCorrect ? "✅ ¡Bien hecho!" : "💡 Aprendamos algo nuevo"}</div>
      ${isCorrect ? c.goodMsg : c.badMsg}
      <div class="points-pill">+${challengePoints()} puntos</div>
    </div>
  ` : "";

  screenEl.innerHTML = `
    ${hud()}
    <div class="card">
      <span class="eyebrow">${c.eyebrow}</span>
      <h1 class="title">${c.icon} ${c.title}</h1>
      <div class="scenario">${c.scenario}</div>
      <p style="font-size:14.5px;font-weight:600;margin:0 0 12px;">${c.question}</p>
      <div class="options">${optsHtml}</div>
      ${feedbackHtml}
      <div class="btn-row" style="margin-top:22px;">
        <span></span>
        ${!state.locked
          ? `<button class="btn btn-primary" onclick="confirmChallenge()" ${sel===null?"disabled":""}>Confirmar respuesta</button>`
          : `<button class="btn btn-primary" onclick="nextChallenge()">Continuar →</button>`
        }
      </div>
    </div>
  `;
}

function selectOption(i){
  if (state.locked) return;
  state.selections[state.current] = i;
  renderChallenge();
}
function challengePoints(){
  const c = CHALLENGES[state.current];
  const sel = state.selections[state.current];
  const correct = sel !== null && c.options[sel] && c.options[sel].correct;
  return correct ? 30 : 10; // siempre suma algo, más si acierta
}
function confirmChallenge(){
  state.locked = true;
  const pts = challengePoints();
  state.score += pts;
  const frag = CHALLENGES[state.current].fragment;
  if (frag !== "★") state.fragments.push(frag);
  renderChallenge();
  renderTrail();
}
function nextChallenge(){
  state.locked = false;
  if (state.current < CHALLENGES.length - 1){
    state.current += 1;
    render();
  } else {
    state.screen = "final";
    render();
  }
}

/* ===================== FINAL CODE ===================== */
function renderFinal(){
  const fragHtml = ["ALI","MEN","TOS"].map(f => {
    const has = state.fragments.includes(f);
    return `<div class="frag ${has ? "" : "empty"}">${has ? f : "···"}</div>`;
  }).join("");

  screenEl.innerHTML = `
    ${hud()}
    <div class="card" style="text-align:center;">
      <span class="eyebrow">Reto final</span>
      <h1 class="title">🔐 Descubre el código</h1>
      <p class="lead">Has recorrido los cinco retos y reunido tres fragmentos a lo largo del camino. Únelos para revelar el código de tu misión.</p>
      <div class="fragments">${fragHtml}</div>
      <button class="btn btn-primary" onclick="revealCode()">Unir fragmentos</button>
      <div id="codeArea"></div>
    </div>
  `;
}
function revealCode(){
  document.getElementById("codeArea").innerHTML = `
    <div class="code-reveal">ALIMENTOS</div>
    <p style="color:var(--text-dim);font-size:14px;margin-bottom:18px;">🏆 ¡Misión completada! Has demostrado que conoces los aspectos fundamentales de tu programa de Ingeniería de Alimentos.</p>
    <button class="btn btn-primary" onclick="goDiploma()">Reclamar diploma virtual 🎓</button>
  `;
}
function goDiploma(){ state.screen = "diploma"; render(); }

/* ===================== DIPLOMA ===================== */
function renderDiploma(){
  const rank = RANKS.find(r => state.score >= r.min);
  screenEl.innerHTML = `
    ${hud()}
    <div class="card" style="text-align:center;">
      <span class="eyebrow">Misión completada</span>
      <h1 class="title">🎓 Diploma virtual</h1>
      <div class="diploma">
        <img class="diploma-logo" src="${LOGO_DATA_URI}" alt="UNAD">
        <div style="font-size:13px;color:var(--text-dim);letter-spacing:.08em;text-transform:uppercase;">Se certifica que</div>
        <input id="studentName" type="text" placeholder="Escribe tu nombre" oninput="updateName()">
        <div style="margin-top:10px;color:var(--text-dim);font-size:14px;">completó la misión del programa de</div>
        <div style="font-family:'Space Grotesk';font-weight:700;font-size:19px;margin-top:2px;">Ingeniería de Alimentos — UNAD</div>
        <div class="rank">${rank.label}</div>
        <div class="score-final">Puntaje final: <b style="color:var(--lime);">${state.score}</b> puntos</div>
      </div>
      <p style="font-size:13px;color:var(--text-dim);">Recuerda: ser Ingeniero(a) de Alimentos no consiste solamente en aprobar cursos. Es aprender, investigar, innovar, trabajar con calidad y generar soluciones para la sociedad.</p>
      <div id="registroStatus" style="text-align:center;font-size:13px;color:var(--text-dim);margin-top:6px;"></div>
      <div class="btn-row" style="margin-top:16px;">
        <button class="btn btn-ghost" onclick="restart()">↺ Jugar de nuevo</button>
        <button class="btn btn-primary" onclick="registrarResultado()">✅ Registrar mi resultado</button>
      </div>
    </div>
  `;
}
function updateName(){} // el valor se lee directamente del input al registrar

function restart(){
  state = { screen:"intro", current:0, score:0, fragments:[], selections:[], locked:false, bonusAnswered:false, bonusSelected:null };
  render();
}

function registrarResultado(){
  const nameEl = document.getElementById("studentName");
  const statusEl = document.getElementById("registroStatus");
  const name = (nameEl && nameEl.value.trim()) ? nameEl.value.trim() : "";
  if (!name){
    if (statusEl) statusEl.innerHTML = "⚠️ Escribe tu nombre arriba antes de registrar.";
    return;
  }
  const rank = RANKS.find(r => state.score >= r.min);
  const record = {
    name,
    score: state.score,
    rank: rank.label,
    fecha: new Date().toLocaleString("es-CO"),
  };
  records.push(record);           // registro local de esta sesión (para el CSV)
  submitToGoogleForm(record);     // envío centralizado a tu Google Sheet
  if (statusEl) statusEl.innerHTML = "✅ ¡Registrado! Ya puedes cerrar o jugar de nuevo.";
  renderTopbar();
}

/* ===================== RECORDS SCREEN ===================== */
function openRecords(){
  state.screen = "records";
  render();
}
function closeRecords(){
  state.screen = "intro";
  render();
}
function renderRecords(){
  let rows;
  if (records.length === 0){
    rows = `<div class="empty-state">Todavía no hay estudiantes registrados en esta sesión.<br>Los registros se guardan aquí a medida que cada estudiante termina y presiona "Registrar y siguiente turno".</div>`;
  } else {
    rows = `<table class="records">
      <thead><tr><th>Nombre</th><th>Puntaje</th><th>Nivel</th><th>Hora</th></tr></thead>
      <tbody>
        ${records.map(r => `<tr><td>${r.name}</td><td>${r.score}</td><td>${r.rank}</td><td>${r.fecha}</td></tr>`).join("")}
      </tbody>
    </table>`;
  }
  screenEl.innerHTML = `
    <div class="card">
      <span class="eyebrow">Panel del docente</span>
      <h1 class="title">📋 Registros de la sesión</h1>
      <p class="lead">Aquí quedan los resultados de los estudiantes que han completado la misión en este navegador. Descárgalos antes de cerrar la página, porque no se guardan en ningún servidor.</p>
      ${rows}
      <div class="btn-row">
        <button class="btn btn-ghost" onclick="closeRecords()">← Volver</button>
        <button class="btn btn-primary" onclick="downloadCSV()" ${records.length===0?"disabled":""}>⬇ Descargar CSV</button>
      </div>
    </div>
  `;
}
function downloadCSV(){
  const header = "Nombre,Puntaje,Nivel,Fecha\n";
  const body = records.map(r =>
    `"${r.name.replace(/"/g,'""')}",${r.score},"${r.rank.replace(/"/g,'""')}","${r.fecha}"`
  ).join("\n");
  const blob = new Blob([header + body], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "registros-mision-alimentos-unad.csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ===================== ROUTER ===================== */
function render(){
  renderTopbar();
  renderTrail();
  if (state.screen === "intro") renderIntro();
  else if (state.screen === "challenge") renderChallenge();
  else if (state.screen === "final") renderFinal();
  else if (state.screen === "diploma") renderDiploma();
  else if (state.screen === "records") renderRecords();
}
render();
</script>
</body>
</html>
